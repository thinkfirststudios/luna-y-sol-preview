<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Luna y Sol — Design Previews</title>
<meta name="robots" content="noindex">
<link href="https://fonts.googleapis.com/css2?family=Parisienne&family=Italiana&family=Jost:wght@300;400&display=swap" rel="stylesheet">
<style>
  :root { --plaster:#EEEAE4; --ink:#1E1B18; --brass:#9E7A45; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--plaster); color:var(--ink); font-family:Jost, system-ui, sans-serif; font-weight:300; padding:3rem 16px; }
  main { width:min(100%, 46rem); text-align:center; }
  h1 { font-family:Parisienne, cursive; font-weight:400; color:var(--brass); font-size:clamp(3.2rem, 12vw, 6rem); margin:0; line-height:1; }
  p { margin:1rem 0 2.5rem; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit, minmax(16rem, 1fr)); gap:1.25rem; }
  a.card { display:block; padding:2rem 1.5rem; border:1px solid var(--brass); color:inherit; text-decoration:none; background:#fff8; transition:background .2s; }
  a.card:hover, a.card:focus-visible { background:#fff; }
  a.card:focus-visible { outline:2px solid var(--ink); outline-offset:3px; }
  .name { display:block; font-size:2rem; margin-bottom:.4rem; }
  .v2 .name { font-family:Parisienne, cursive; color:var(--brass); }
  .v3 .name { font-family:Italiana, serif; letter-spacing:.12em; }
</style>
</head>
<body>
<main>
  <h1>Luna y Sol</h1>
  <p>New website directions. Pick one to explore. Every page is clickable.</p>
  <div class="grid">
    <a class="card v2" href="v2/index.html"><span class="name">Blush &amp; Brass</span>Version 2: editorial, warm blush, script-led</a>
    <a class="card v3" href="v3/index.html"><span class="name">GOLDEN GODDESS</span>Version 3: centered, gold sign lettering, arched mirrors</a>
    <a class="card v3" href="v4/index.html"><span class="name">GOLDEN GODDESS II</span>Version 4: Version 3 with real clients in the salon as the opening</a>
  </div>
</main>
</body>
</html>
